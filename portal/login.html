<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Login | Khadijatul Kubra Trust</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="shortcut icon" href="../assets/images/favicon.png">
</head>
<body class="login-page">
  <div class="login-card">
    <img src="../assets/images/logo.png" alt="Khadijatul Kubra Trust">
    <h1>Admin Portal</h1>
    <p>Mosque · Madrasah · Donation · Marriage CRM</p>
    <div id="error" class="alert alert-error hidden"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" value="admin" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="admin123" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <p class="muted" style="margin-top:18px">Default: admin / admin123</p>
  </div>
  <script>
    (async function () {
      try {
        const me = await fetch("/api/me");
        if (me.ok) location.href = "/portal/index.html";
      } catch (_) {}
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      error.classList.add("hidden");
      const body = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      };
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        error.textContent = "Invalid username or password";
        error.classList.remove("hidden");
        return;
      }
      location.href = "/portal/index.html";
    });
  </script>
</body>
</html>
